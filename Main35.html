<DOCTYPE html>
<html>

<body>

<h2> Operator</h2>
<p id="demo"></p>
<p id="demo1"></p>
<script>
    <!--Addition-->
    //*use +, -, *, / operators*/
    var x = 5;
    var y = 2;
    var z = x + y;
    document.getElementById("demo").innerHTML = z;
    var z1 = x - y;
        document.getElementById("demo1").innerHTML = z1;
</script>
</body>
</html>
