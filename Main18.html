<!DOCTYPE html>
<html lang="en">
    <head>
        <title>My Colour Card</title>

        <style>

            /* Universal Selector - applies to everything on the page */
            * {
                font-size: 16px;
            }

            /* Element Selectors */
            body {
                background-color: lightgray;
            }

            h1{
                color: darkblue;
            }

            h2{
                color: purple;
            }
            p{
                color: dimgray;
            }

            /* Class Selector */
            .my-detail{
                color: darkgreen;
                font-weight: bold;
            }

            /* ID Selector */
            #my-card{
                background-color: lightcyan;
            }

        </style>
    </head>
    <body>

        <h1>My Color Card</h1>

        <!-- Inline CSS: Add style="color: ____;" inside this ptag-->
         <p style="color: crimson;">Hi! This is my very own webpage.</p>

         <div id="my-card">

            <h2>About Me</h2>
         <p class="my-detail">My name is Sam.</p>
         <p class="my-detail"> My favorite color is red</p>
         <p class="my-detail">My favorite subject is Math.</p>
         <p class="my-detail">My favorite food is pasta.</p>

        </div>

        <h2>My favorite Things</h2>
        <p>My favorite animal is a cat.</p>
        <p>My favorite sport is cricket.</p>
        <p>My favorite movie is The Lion King.</p>
        
    </body>
</html>
